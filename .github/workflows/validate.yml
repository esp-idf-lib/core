---
name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install python packages
        run: |
          pip install -r tools/requirements.txt

      - name: Run tests
        run: |
          python -m pytest tools/tests -q

      - name: Validate persons.yml
        run: |
          python tools/cli.py validate

  documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install python packages
        run: |
          pip install -r tools/requirements.txt

      - name: Verify generated documents are up-to-date
        run: |
          python tools/cli.py docs check
